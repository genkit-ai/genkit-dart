name: genkit_workspace
description: Genkit Dart Monorepo
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  # NOTE: This list is intentionally incomplete.
  # Packages that depend on flutter are excluded! 
  - packages/_schema_generator
  - packages/genkit
  - packages/genkit_mcp
  - packages/genkit_google_cloud
  - packages/genkit_google_genai
  - packages/genkit_vertexai
  - packages/genkit_vertex_auth
  - packages/genkit_openai
  - packages/genkit_otel
  - packages/genkit_anthropic
  - packages/genkit_shelf
  - packages/genkit_chrome
  - packages/schemantic
  - packages/schemantic_builder
  - packages/genkit_middleware
  - packages/genkit_a2ui
  - testapps/agents
  - testapps/agentic_patterns
  - testapps/ai_features
  - testapps/basic
  - testapps/chrome_example
  - testapps/openai_sample
  - testapps/anthropic_sample
  - testapps/mcp
  - testapps/middleware
  - testapps/remote_models
  - testapps/gemini
  - testapps/otel_jaeger
  - testapps/prompts
  - testapps/evals
  - testapps/schemantic_sample

dev_dependencies:
  args: ^2.7.0
  dart_flutter_team_lints: ^3.0.0
  glob: ^2.1.3
  melos: ^8.7.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  test: ^1.30.0
  yaml: ^3.1.2
  
melos:
  name: genkit_workspace
  packages:
    - packages/**
  
  # Scripts call `melos exec` explicitly instead of using `exec:`. With melos
  # as a dev_dependency, `exec:` makes melos re-launch itself via
  # `dart run melos:melos`, which breaks on Dart 3.14 dev
  # (https://github.com/blaugold/cli_launcher/issues/28). An explicit
  # `melos exec` goes through the shell and uses the globally activated melos.
  # `packageFilters` still apply: melos passes them to the nested call via
  # MELOS_PACKAGES. Switch back to `exec:` once cli_launcher is fixed.
  scripts:
    test:
      run: melos exec -- "dart test"
      packageFilters:
        dirExists: test

    test-firestore:
      run: >-
        cd packages/genkit_google_cloud &&
        GOOGLE_CLOUD_PROJECT=demo-genkit firebase emulators:exec
        --only firestore --project demo-genkit "dart test"
      description: >-
        Run the genkit_google_cloud tests against the Firestore emulator
        (requires firebase-tools + Java 21+).

    analyze:
      run: melos exec -- "dart analyze --fatal-infos ."

    telemetry:
      run: cd testapps/otel_jaeger && dart run tool/telemetry.dart
      description: >-
        Start a Docker-free local telemetry stack (Jaeger + otelcol-contrib) for
        the otel_jaeger sample. Downloads the binaries on first run.

    build-gen:
      run: |
        melos run build-gen-core
        melos run build-gen-plugins
        melos run build-gen-testapps
        dart run tools/apply_license.dart
      description: Run build_runner in topological order (core -> plugins -> app) to avoid race conditions.

    build-gen-core:
      run: melos exec -- "dart run build_runner build"
      packageFilters:
        scope: "{schemantic_builder,genkit}"
      description: Run build_runner for genkit.

    build-gen-plugins:
      run: melos exec -- "dart run build_runner build"
      packageFilters:
        scope: "{genkit_a2ui,genkit_anthropic,genkit_chrome,genkit_firebase_ai,genkit_google_genai,genkit_mcp,genkit_middleware,genkit_openai,genkit_shelf,genkit_vertexai}"
      description: Run build_runner for plugins.

    build-gen-testapps:
      run: melos exec -- "dart run build_runner build"
      packageFilters:
        scope: "{agentic_patterns,ai_features,anthropic_sample,basic_sample,gemini_testapp,mcp_sample,openai_sample,schemantic_sample}"
      description: Run build_runner for testapps (except Flutter ones).

    dartdoc-check:
      run: dart tools/check_dartdoc.dart
      description: Run dartdoc over all non-private packages and check for warnings.
