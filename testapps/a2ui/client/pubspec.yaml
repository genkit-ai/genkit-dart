name: a2ui_client
description: >-
  A2UI sample Flutter client: renders an A2UI-enabled Genkit agent's surfaces
  with genui. Deliberately does not depend on genkit_a2ui; the server lives in
  ../server.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  a2ui_core: ^0.1.0
  genui: ^0.10.3
  # Used by the custom `Gauge` catalog item (lib/gauge.dart) to build its prop
  # schema with `S`/`Schema`. genui depends on the same package.
  json_schema_builder: ^0.1.3

  genkit:
    path: ../../../packages/genkit

dependency_overrides:
  genkit:
    path: ../../../packages/genkit
  schemantic:
    path: ../../../packages/schemantic

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
