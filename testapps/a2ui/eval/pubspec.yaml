name: a2ui_eval
description: >-
  Rerunnable multi-turn evaluation of the A2UI sample agent: drives the real
  agent through scripted conversations, replays the emitted A2UI messages into
  a headless renderer, and reports per-check pass rates.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  a2ui_core: ^0.7.0
  a2ui_server: any
  args: ^2.6.0
  genkit: ^1.0.2
  genkit_a2ui: ^0.5.0
  logging: ^1.3.0

dev_dependencies:
  test: ^1.24.0
