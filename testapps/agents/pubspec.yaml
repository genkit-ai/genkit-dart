name: agents_sample
description: >-
  Genkit Dart agents testapp — a faithful port of the JS `testapps/agents`
  sample. A shelf server exposes a suite of agents (weather, banking,
  background, branching, tasks, research, trip planner, coding, workspace,
  sub-agent delegation) consumed by a Jaspr web UI under `web/`.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  genkit: ^1.0.0-rc.3
  genkit_google_genai: ^1.0.0-rc.3
  genkit_middleware: ^1.0.0-rc.3
  genkit_shelf: ^1.0.0-rc.3
  logging: ^1.3.0
  path: ^1.9.0
  schemantic: ^1.0.0-rc.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.10.5
  schemantic_builder: ^1.0.0-rc.1
  test: ^1.29.0
