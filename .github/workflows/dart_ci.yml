name: Dart CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Run Dart Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.10', dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Run Code Generation
        run: melos run build-gen

      - name: Analyze Project Source
        run: melos run analyze

      - name: Run Tests
        run: melos run test

      - name: Verify clean git tree
        run: '[ -z "$(git status --short)" ] || (git status --short && exit 1)'

  firestore-emulator-test:
    name: Firestore Emulator Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.10'

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Run FirestoreSessionStore tests against the emulator
        working-directory: packages/genkit_google_cloud
        env:
          GOOGLE_CLOUD_PROJECT: demo-genkit
        run: >-
          firebase emulators:exec --only firestore --project demo-genkit
          "dart test"
