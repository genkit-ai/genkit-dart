name: genkit_anthropic
description: Anthropic plugin for Genkit Dart, providing Claude model integration with tool calling, multimodal inputs, and streaming support.
resolution: workspace
version: 1.0.1
repository: https://github.com/genkit-ai/genkit-dart
license: Apache-2.0

environment:
  sdk: ^3.12.0

dependencies:
  # Floor is 9.0.1, not the workspace-wide >=2.1.0: this plugin builds thinking
  # blocks with ThinkingInputBlock / RedactedThinkingInputBlock, which 8.0.0
  # introduced, and 9.0.1 stops responses with an empty or unknown
  # `usage.service_tier` from failing to deserialize.
  anthropic_sdk_dart: ^9.0.1
  genkit: ^1.0.1
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.17.0
  schemantic: ^1.0.0

dev_dependencies:
  build_runner: ^2.10.5
  schemantic_builder: ^1.0.0
  test: ^1.29.0
