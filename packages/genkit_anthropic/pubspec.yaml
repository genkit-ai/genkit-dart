name: genkit_anthropic
description: Anthropic plugin for Genkit Dart, providing Claude model integration with tool calling, multimodal inputs, and streaming support.
resolution: workspace
version: 1.0.0-rc.1
repository: https://github.com/genkit-ai/genkit-dart
license: Apache-2.0

environment:
  sdk: ^3.12.0

dependencies:
  # Floor is 8.0.0, not the workspace-wide >=2.1.0: this plugin now builds
  # thinking blocks with ThinkingInputBlock / RedactedThinkingInputBlock, which
  # 8.0.0 introduced. Resolving anything older would not compile.
  anthropic_sdk_dart: ^8.0.0
  genkit: ^1.0.0-rc.1
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.17.0
  schemantic: ^1.0.0-rc.1

dev_dependencies:
  build_runner: ^2.10.5
  schemantic_builder: ^1.0.0-rc.1
  test: ^1.29.0
