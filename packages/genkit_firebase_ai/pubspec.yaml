name: genkit_firebase_ai
description: Firebase AI plugin for Genkit Dart.
version: 0.3.0-rc.3
repository: https://github.com/genkit-ai/genkit-dart
license: Apache-2.0

environment:
  sdk: ^3.12.0

dependencies:
  firebase_ai: ^3.8.0
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  genkit: ^1.0.0-rc.3
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.17.0
  schemantic: ^1.0.0-rc.1

dev_dependencies:
  # Temporary: analyzer 14.5.0 breaks build_runner 2.16.1
  # (https://github.com/dart-lang/build/issues/5197). Remove once a fixed
  # build_runner is published.
  analyzer: '>=13.0.0 <14.5.0'
  build_runner: ^2.10.5
  dart_flutter_team_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  schemantic_builder: ^1.0.0-rc.1

# Used to resolve local packages during development
dependency_overrides:
  genkit:
    path: ../genkit
  schemantic:
    path: ../schemantic
  schemantic_builder:
    path: ../schemantic_builder
