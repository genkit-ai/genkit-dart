name: genkit_a2ui
description: >-
  A2UI (Agent-to-UI) streaming UI protocol support for Genkit Dart, provided as
  model middleware.
version: 0.4.0
resolution: workspace
repository: https://github.com/genkit-ai/genkit-dart
license: Apache-2.0
topics:
  - genkit
  - a2ui
  - genai
  - ui

screenshots:
  - description: An A2UI weather card rendered by a Flutter genui client.
    path: doc/a2ui.png

environment:
  sdk: ^3.12.0

dependencies:
  genkit: ^1.0.0
  logging: ^1.3.0
  schemantic: ^1.0.0

dev_dependencies:
  build_runner: ^2.10.5
  genkit_google_genai: ^1.0.0
  schemantic_builder: ^1.0.0
  test: ^1.24.0
