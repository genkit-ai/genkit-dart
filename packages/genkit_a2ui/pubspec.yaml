name: genkit_a2ui
description: >-
  A2UI (Agent-to-UI) streaming UI protocol support for Genkit Dart, provided as
  model middleware.
version: 0.2.1-rc.2
resolution: workspace
repository: https://github.com/genkit-ai/genkit-dart
license: Apache-2.0
topics:
  - genkit
  - a2ui
  - genai
  - ui

screenshots:
  - description: An A2UI weather card rendered by a Flutter genui client.
    path: doc/a2ui.png

environment:
  sdk: ^3.10.0

dependencies:
  genkit: ^0.16.0-rc.2
  logging: ^1.3.0
  schemantic: ^0.2.2

dev_dependencies:
  build_runner: ^2.10.5
  genkit_google_genai: ^0.3.0-rc.2
  schemantic_builder: ^0.1.2
  test: ^1.24.0
